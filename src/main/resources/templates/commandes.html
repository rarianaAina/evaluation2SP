<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Commandes - [[${supplier}]]</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="container mt-4">
  <h2>Commandes du fournisseur : <span th:text="${supplier}"></span></h2>
  <table class="table table-bordered table-striped mt-3">
    <thead class="table-primary">
    <tr>
      <th>N° Commande</th>
      <th>Date</th>
      <th>Status</th>
      <th>Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="commande : ${commandes}">
      <td th:text="${commande.name}"></td>
      <td th:text="${commande.transaction_date}"></td>
      <td th:text="${commande.status}"></td>
      <td th:text="${commande.grand_total} + ' EUR'"></td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
