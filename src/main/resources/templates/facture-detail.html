<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail de la Facture</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<div>

<body class="container mt-5">

<div th:replace="layout/header :: header"></div>

<h2>Détail de la Facture <span th:text="${facture.name}"></span></h2>
<p><strong>Fournisseur :</strong> <span th:text="${facture.supplier}"></span></p>
<p><strong>Date :</strong> <span th:text="${facture.posting_date}"></span></p>
<p><strong>Date d’échéance :</strong> <span th:text="${facture.due_date}"></span></p>
<p><strong>Status :</strong> <span th:text="${facture.status}"></span></p>
<p><strong>Total :</strong> <span th:text="${facture.grand_total} + ' Ar'"></span></p>

<h4>Articles</h4>
<table class="table table-bordered">
  <thead>
  <tr>
    <th>Nom</th>
    <th>Quantité</th>
    <th>Prix unitaire</th>
    <th>Montant</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${facture.items}">
    <td th:text="${item.item_name}"></td>
    <td th:text="${item.qty}"></td>
    <td th:text="${item.rate}"></td>
    <td th:text="${item.amount}"></td>
  </tr>
  </tbody>
</table>

<a href="/invoices" class="btn btn-secondary">Retour</a>
</body>

</div>

</html>
