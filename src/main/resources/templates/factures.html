<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liste des Factures</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">

<div th:replace="layout/header :: header"></div>

<h2>Liste des Factures</h2>

<div>

  <table class="table table-bordered">
    <thead class="table-primary">
    <tr>
      <th>Numéro</th>
      <th>Fournisseur</th>
      <th>Date</th>
      <th>Status</th>
      <th>Total</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="facture : ${factures}">
      <td th:text="${facture.name}"></td>
      <td th:text="${facture.supplier}"></td>
      <td th:text="${facture.posting_date}"></td>
      <td th:text="${facture.status}"></td>
      <td th:text="${facture.grand_total} + ' Ar'"></td>
      <td class="d-flex gap-1">
        <a th:href="@{/invoices/{name}(name=${facture.name})}" class="btn btn-sm btn-primary">Détails</a>

        <!-- Formulaire de paiement -->
        <form th:action="@{/pay}" method="post">
          <input type="hidden" name="invoiceName" th:value="${facture.name}" />
          <input type="hidden" name="supplier" th:value="${facture.supplier}" />
          <input type="hidden" name="amount" th:value="${facture.grand_total}" />
          <button type="submit" class="btn btn-sm btn-success">Payer</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>

</body>
</html>
