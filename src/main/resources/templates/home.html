<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERPNext Client - Tableau de bord</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title"><i class="bi bi-shop"></i> Module Fournisseur</h3>
            <p class="card-text">Sélectionnez un fournisseur pour gérer ses demandes de devis et commandes.</p>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>Nom du fournisseur</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fournisseur : ${fournisseurs}">
                        <td th:text="${fournisseur.name}"></td>
                        <td class="text-center">
                            <a th:href="@{/quotations(supplier=${fournisseur.name})}" class="btn btn-sm btn-outline-primary me-2">
                                <i class="bi bi-file-earmark-text"></i> Devis
                            </a>
                            <a th:href="@{/orders(supplier=${fournisseur.name})}" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-cart-check"></i> Commandes
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
