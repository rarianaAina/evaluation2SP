<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails du Supplier Quotation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-5">

<div th:replace="layout/header :: header"></div>

<h2>Détails du Supplier Quotation</h2>

<p><strong>Numéro :</strong> <span th:text="${quotation.name}" id="quotationName"></span></p>
<p><strong>Fournisseur :</strong> <span th:text="${quotation.supplier}"></span></p>
<p><strong>Date :</strong> <span th:text="${quotation.transaction_date}"></span></p>
<p><strong>Status :</strong> <span th:text="${quotation.status}"></span></p>

<h4>Articles</h4>
<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>Code</th>
        <th>Nom</th>
        <th>Quantité</th>
        <th>Prix Unitaire</th>
        <th>Montant</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${quotation.items}">
        <td th:text="${item.item_code}"
            th:id="'itemCode_' + ${iterStat.index}"
            th:attr="data-qty=${item.qty}, data-item-name=${item.item_name}, data-uom=${item.uom}">
        </td>
        <td th:text="${item.item_name}"></td>
        <td th:text="${item.qty}"></td>
        <td>
            <span th:id="'rateDisplay_' + ${iterStat.index}" th:text="${item.rate} + ' Ar'"></span>

            <input type="number"
                   class="form-control form-control-sm d-none"
                   th:id="'rateInput_' + ${iterStat.index}"
                   th:value="${item.rate}" />

            <div class="mt-1">
                <button type="button"
                        class="btn btn-sm btn-outline-secondary"
                        th:attr="onclick='toggleRateInput(' + ${iterStat.index} + ')'">
                    Modifier
                </button>

                <button type="button"
                        class="btn btn-sm btn-success d-none"
                        th:id="'validateBtn_' + ${iterStat.index}"
                        th:attr="onclick='validateRate(' + ${iterStat.index} + ')'">
                    Valider
                </button>
            </div>
        </td>
        <td th:text="${item.amount} + ' Ar'"></td>
    </tr>
    </tbody>
</table>

<script>
    function toggleRateInput(index) {
        const span = document.getElementById('rateDisplay_' + index);
        const input = document.getElementById('rateInput_' + index);
        const validateBtn = document.getElementById('validateBtn_' + index);

        span.classList.add('d-none');
        input.classList.remove('d-none');
        validateBtn.classList.remove('d-none');
    }

    function validateRate(index) {
        const input = document.getElementById('rateInput_' + index);
        const span = document.getElementById('rateDisplay_' + index);
        const validateBtn = document.getElementById('validateBtn_' + index);
        const itemCell = document.getElementById('itemCode_' + index);
        const quotationName = document.getElementById('quotationName').innerText;
        const itemName = itemCell.getAttribute('data-item-name');
        const itemCode = itemCell.innerText.trim();
        const newRate = parseFloat(input.value);
        const qty = parseFloat(itemCell.getAttribute('data-qty'));
        const uom = itemCell.getAttribute('data-uom');

        // ✅ Mise à jour visuelle
        span.textContent = newRate + ' Ar';
        span.classList.remove('d-none');
        input.classList.add('d-none');
        validateBtn.classList.add('d-none');

        // 🚀 Appel API
        fetch('/update-rate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                quotationName,
                itemCode,
                newRate,
                qty,
                itemName,
                uom,
            })
        }).then(response => {
            if (!response.ok) throw new Error("Erreur de mise à jour");
            return response.json();
        }).then(data => {
            alert("Prix mis à jour avec succès !");
        }).catch(error => {
            alert("Erreur lors de la mise à jour : " + error.message);
        });
    }
</script>

</body>
</html>
