<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Devis fournisseurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body class="container mt-5">
<div th:replace="layout/header :: header"></div>

<h2>Liste des Devis Fournisseurs</h2>


<div>
    <table class="table table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Réf</th>
            <th>Fournisseur</th>
            <th>Date</th>
            <th>Statut</th>
            <th>Total</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="q : ${quotations}">
            <td th:text="${q.name}"></td>
            <td th:text="${q.supplier}"></td>
            <td th:text="${q.transaction_date}"></td>
            <td th:text="${q.status}"></td>
            <td th:text="${q.grand_total} + ' Ar'"></td>
            <td>
                <a th:href="@{/quotation-items(parentId=${q.name})}" class="btn btn-sm btn-outline-primary me-2">
                    <i class="bi bi-file-earmark-text"></i> Devis
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
